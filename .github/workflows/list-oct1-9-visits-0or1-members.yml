name: List Oct1-9 Visits 0-or-1 Members

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/oct1-9-visits-0or1-2693
    paths:
      - "scripts/list-oct1-9-visits-0or1-members.mjs"
      - "scripts/lib/supabaseFetchAll.mjs"
      - ".github/workflows/list-oct1-9-visits-0or1-members.yml"

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | tr -d '\r\n')"
          export SUPABASE_SERVICE_ROLE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"
          node scripts/list-oct1-9-visits-0or1-members.mjs

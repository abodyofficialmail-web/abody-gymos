name: List Takeharu Shifts 2026-09

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/aug-expense-ratio-7588
    paths:
      - "scripts/list-takeharu-shifts-2026-09.mjs"

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/list-takeharu-shifts-2026-09.mjs

name: Send Sep Low Booking Motivation LINE

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/send-sep-low-booking-motivation-line.yml"
      - "scripts/send-sep-low-booking-motivation-line.mjs"
  workflow_dispatch:
    inputs:
      confirm:
        description: "true で本番送信（デフォルト dry-run）"
        required: false
        default: "false"
      video_url:
        description: "動画URL（HTTPS・MP4推奨）"
        required: false
        default: ""
      preview_url:
        description: "動画プレビュー画像URL（HTTPS）"
        required: false
        default: ""

jobs:
  send:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[send-sep-line-dry-run]') || contains(github.event.head_commit.message, '[send-sep-line-confirm]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MEMBER_PLANS_API_URL: https://abody-gymos.vercel.app
          SEP_LOW_BOOKING_VIDEO_URL: ${{ github.event.inputs.video_url || secrets.SEP_LOW_BOOKING_VIDEO_URL }}
          SEP_LOW_BOOKING_VIDEO_PREVIEW_URL: ${{ github.event.inputs.preview_url || secrets.SEP_LOW_BOOKING_VIDEO_PREVIEW_URL }}
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | tr -d '\r\n')"
          export SUPABASE_SERVICE_ROLE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"
          ARGS=(--api)
          CONFIRM=false
          if [ "${{ github.event.inputs.confirm || 'false' }}" = "true" ]; then CONFIRM=true; fi
          if [ "${{ github.event_name }}" = "push" ] && printf '%s' "${{ github.event.head_commit.message || '' }}" | grep -qF '[send-sep-line-confirm]'; then CONFIRM=true; fi
          if [ "$CONFIRM" = "true" ]; then ARGS+=(--confirm); else ARGS+=(--dry-run); fi
          if [ -n "${SEP_LOW_BOOKING_VIDEO_URL:-}" ]; then
            ARGS+=(--video-url="$SEP_LOW_BOOKING_VIDEO_URL")
          fi
          if [ -n "${SEP_LOW_BOOKING_VIDEO_PREVIEW_URL:-}" ]; then
            ARGS+=(--preview-url="$SEP_LOW_BOOKING_VIDEO_PREVIEW_URL")
          fi
          node scripts/send-sep-low-booking-motivation-line.mjs "${ARGS[@]}"

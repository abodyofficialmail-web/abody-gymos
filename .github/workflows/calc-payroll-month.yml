name: Calc Payroll Month

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Target month (YYYY-MM)"
        required: false
        default: "2026-08"
  push:
    branches:
      - cursor/aug-expense-ratio-7588
    paths:
      - ".github/workflows/calc-payroll-month.yml"
      - "scripts/calc-payroll-month.mjs"

jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - name: Calc monthly payroll
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | tr -d '\r\n')"
          export SUPABASE_SERVICE_ROLE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"
          MONTH="${{ github.event.inputs.month || '2026-08' }}"
          node scripts/calc-payroll-month.mjs "$MONTH"

name: List Aug8 Sep7+ Members

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/aug10-sep2-members-7588
    paths:
      - "scripts/list-aug8-sep7plus-members.mjs"
      - "scripts/export-member-plans-snapshot.mjs"
      - "scripts/data/member-plans.json"
      - "scripts/lib/supabaseFetchAll.mjs"
      - "scripts/lib/fetchMemberPlansFromSheet.mjs"
      - "src/app/api/admin/member-plans/**"
      - "src/lib/sheets.ts"
      - ".github/workflows/list-aug8-sep7plus-members.yml"

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          MEMBER_PLANS_API_URL: https://abody-gymos.vercel.app
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | tr -d '\r\n')"
          export SUPABASE_SERVICE_ROLE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"
          export GOOGLE_SHEET_ID="$(printf '%s' "$GOOGLE_SHEET_ID" | tr -d '\r\n')"
          export GOOGLE_SERVICE_ACCOUNT_EMAIL="$(printf '%s' "$GOOGLE_SERVICE_ACCOUNT_EMAIL" | tr -d '\r\n')"
          export GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY="$(printf '%s' "$GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY" | tr -d '\r\n')"
          # 本番API or Sheets からスナップショット更新（失敗しても続行）
          node scripts/export-member-plans-snapshot.mjs --from-production 2>/dev/null || \
            node scripts/export-member-plans-snapshot.mjs 2>/dev/null || true
          node scripts/list-aug8-sep7plus-members.mjs

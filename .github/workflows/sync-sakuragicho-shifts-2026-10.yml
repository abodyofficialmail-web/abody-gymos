name: Sync Sakuragicho Shifts 2026-10

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true でDB更新しない"
        required: false
        default: true
        type: boolean
      sync_db:
        description: "true で本番DBへ反映"
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | tr -d '\r\n')"
          export SUPABASE_SERVICE_ROLE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"
          ARGS=(--dry-run)
          if [ "${{ github.event.inputs.sync_db }}" = "true" ]; then ARGS=(); fi
          node scripts/sync-sakuragicho-shifts-2026-10.mjs "${ARGS[@]}"

name: Upload Sep Low Booking Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "MP4のダウンロードURL（Google Drive/Dropbox等の直リンク）"
        required: false
        default: "https://drive.google.com/uc?export=download&id=1d_axY4zkVwdd8_OgDSpLpZrVqtmdH4pB"
      preview_url:
        description: "プレビュー画像URL（省略時はffmpegで動画から生成）"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - ".github/workflows/upload-sep-low-booking-video.yml"

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[upload-sep-video]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --legacy-peer-deps
      - env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | tr -d '\r\n')"
          export SUPABASE_SERVICE_ROLE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"
          VIDEO_URL="${{ github.event.inputs.video_url || 'https://drive.google.com/uc?export=download&id=1d_axY4zkVwdd8_OgDSpLpZrVqtmdH4pB' }}"
          PREVIEW_URL="${{ github.event.inputs.preview_url || '' }}"
          ARGS=(--video-url="$VIDEO_URL")
          if [ -n "$PREVIEW_URL" ]; then
            ARGS+=(--preview-url="$PREVIEW_URL")
          fi
          node scripts/upload-line-campaign-media.mjs "${ARGS[@]}"

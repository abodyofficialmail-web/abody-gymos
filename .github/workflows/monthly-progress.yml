name: Monthly Progress (month-end)

# Mac不要: GitHub Actions 上で月末に生成→送信
# 14:00 JST = 05:00 UTC / 20:00 JST = 11:00 UTC
#
# 必要な Secrets:
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

on:
  schedule:
    - cron: "0 5 28-31 * *" # 14:00 JST → persist
    - cron: "0 11 28-31 * *" # 20:00 JST → send
  workflow_dispatch:
    inputs:
      phase:
        description: "persist | send | all"
        required: true
        default: "persist"
        type: choice
        options:
          - persist
          - send
          - all
      month:
        description: "YYYY-MM (empty = current JST month)"
        required: false
        default: ""
      force:
        description: "月末以外でも実行"
        required: false
        default: false
        type: boolean

concurrency:
  group: monthly-progress-${{ github.event.inputs.phase || 'auto' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python / Pillow
        run: python3 -m pip install --user pillow

      - name: Install Google Chrome
        id: chrome
        run: |
          set -euo pipefail
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/chrome.deb
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome)"
          echo "chrome-path=$CHROME_BIN" >> "$GITHUB_OUTPUT"
          "$CHROME_BIN" --version

      - name: Install deps
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-save @supabase/supabase-js@2.103.0 luxon@3.4.4
          node -e "require('@supabase/supabase-js'); require('luxon'); console.log('deps ok')"

      - name: Resolve phase
        id: meta
        run: |
          set -euo pipefail
          HOUR_UTC=$(date -u +%H)
          if [ -n "${{ github.event.inputs.phase }}" ]; then
            PHASE="${{ github.event.inputs.phase }}"
          elif [ "$HOUR_UTC" -lt 11 ]; then
            PHASE=persist
          else
            PHASE=send
          fi
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "Resolved phase=$PHASE hour_utc=$HOUR_UTC"

      - name: Preflight
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          echo "chrome=$CHROME_PATH"
          test -x "$CHROME_PATH"
          test -n "${NEXT_PUBLIC_SUPABASE_URL:-}" || { echo "missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          echo "supabase_url_len=${#NEXT_PUBLIC_SUPABASE_URL}"
          echo "service_role_len=${#SUPABASE_SERVICE_ROLE_KEY}"
          echo "url_prefix=${NEXT_PUBLIC_SUPABASE_URL:0:30}"

      - name: Run month-end job
        env:
          CI: "true"
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # Secrets の改行混入を除去
          export NEXT_PUBLIC_SUPABASE_URL="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | tr -d '\r\n')"
          export SUPABASE_SERVICE_ROLE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"

          ARGS=(--audience=active-line --confirm-send --phase=${{ steps.meta.outputs.phase }})
          if [ -n "${{ github.event.inputs.month }}" ]; then
            ARGS+=(--month=${{ github.event.inputs.month }})
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          echo "node scripts/run-monthly-progress-month-end.mjs ${ARGS[*]}"
          node scripts/run-monthly-progress-month-end.mjs "${ARGS[@]}"

name: Count Booked Slots 2026-09

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/aug-expense-ratio-7588
    paths:
      - "scripts/count-booked-slots-2026-09.mjs"
      - ".github/workflows/count-booked-slots-2026-09.yml"

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - name: Count booked slots
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | tr -d '\r\n')"
          export SUPABASE_SERVICE_ROLE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"
          node scripts/count-booked-slots-2026-09.mjs

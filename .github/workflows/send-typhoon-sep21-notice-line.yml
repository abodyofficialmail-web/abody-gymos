# Typhoon notice LINE for Sep 21 bookers (non-Fukuoka reservations)
name: Send Typhoon Sep21 Notice LINE

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/send-typhoon-sep21-notice-line.yml"
      - "scripts/send-typhoon-sep21-notice-line.mjs"
      - "src/lib/typhoonSep21NoticeLine.ts"
      - "src/app/api/admin/send-typhoon-sep21-notice-line/**"
  workflow_dispatch:
    inputs:
      confirm:
        description: "true で本番送信（デフォルト dry-run）"
        required: false
        default: "false"
      date:
        description: "対象日 JST (YYYY-MM-DD)"
        required: false
        default: "2026-09-21"

jobs:
  send:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[send-typhoon-line-dry-run]') || contains(github.event.head_commit.message, '[send-typhoon-line-confirm]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MEMBER_PLANS_API_URL: https://abody-gymos.vercel.app
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | tr -d '\r\n')"
          export SUPABASE_SERVICE_ROLE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"
          ARGS=(--api)
          CONFIRM=false
          if [ "${{ github.event.inputs.confirm || 'false' }}" = "true" ]; then CONFIRM=true; fi
          if [ "${{ github.event_name }}" = "push" ] && printf '%s' "${{ github.event.head_commit.message || '' }}" | grep -qF '[send-typhoon-line-confirm]'; then CONFIRM=true; fi
          if [ "$CONFIRM" = "true" ]; then ARGS+=(--confirm); else ARGS+=(--dry-run); fi
          DATE="${{ github.event.inputs.date || '2026-09-21' }}"
          ARGS+=(--date="$DATE" --exclude-store=福岡)
          node scripts/send-typhoon-sep21-notice-line.mjs "${ARGS[@]}"

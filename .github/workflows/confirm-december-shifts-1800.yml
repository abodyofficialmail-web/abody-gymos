name: Confirm December shifts at 18:00

# 2026-11-27 18:00（日本時間）に、東京4店舗の12月下書きを確定へ戻す。
# 予約は更新しない。18:00より前に走ってもスクリプト側で止まる。
# 開始から18:00までが5時間40分を超えるときは、この回では待たずに終わる。
# run token: 2

on:
  push:
    branches:
      - cursor/december-tokyo-shifts-e10a
    paths:
      - .github/workflows/confirm-december-shifts-1800.yml
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Wait until 18:00 JST and confirm
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          set +e
          python3 - << 'PY'
          import time
          from datetime import datetime, timedelta, timezone
          jst = timezone(timedelta(hours=9))
          target = datetime(2026, 11, 27, 18, 0, tzinfo=jst)
          wait = (target - datetime.now(jst)).total_seconds()
          print(f"wait_seconds {wait:.0f}")
          if wait > 20400:
              raise SystemExit(2)
          if wait > 0:
              time.sleep(wait + 2)
          PY
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "too early, leaving December shifts as draft"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          export NEXT_PUBLIC_SUPABASE_URL="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | tr -d '\r\n')"
          export SUPABASE_SERVICE_ROLE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"
          node scripts/confirm-december-shifts.mjs
